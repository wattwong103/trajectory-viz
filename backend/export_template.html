<!DOCTYPE html>
<!--
  trajectory-viz single-file cinematic export (Phase 2D).
  Generated by backend/export.py — fully self-contained: deck.gl and all data
  are inlined below; this page makes ZERO network requests at runtime.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  html, body { margin: 0; height: 100%; background: #07090c; overflow: hidden;
               font: 13px/1.45 "Helvetica Neue", Arial, sans-serif; color: #e8ebef; }
  #deck-container { position: absolute; inset: 0; }
  .card { position: absolute; background: rgba(13,16,21,.87); border: 1px solid #232a35;
          border-radius: 8px; padding: 10px 14px; backdrop-filter: blur(6px); z-index: 2; }
  #panel { top: 14px; left: 14px; max-width: 280px; }
  #panel h1 { font-size: 14px; margin: 0 0 2px; letter-spacing: .4px; }
  #panel .muted { color: #8b95a3; font-size: 11px; }
  .legend-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 11px; }
  .chip { width: 10px; height: 10px; border-radius: 2px; }
  label.toggle { display: flex; align-items: center; gap: 6px; margin-top: 6px;
                 font-size: 12px; cursor: pointer; }
  input[type=checkbox] { accent-color: #17b8be; }
  #controls { bottom: 14px; left: 50%; transform: translateX(-50%);
              display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
  #playBtn { background: #17b8be22; color: #4fe3e9; border: 1px solid #17b8be66;
             border-radius: 6px; width: 34px; height: 28px; cursor: pointer; font-size: 13px; }
  #scrub { width: min(420px, 40vw); accent-color: #17b8be; }
  #clock { font-family: ui-monospace, monospace; font-size: 16px; min-width: 56px; color: #4fe3e9; }
  select { background: #10151c; color: #cfd6df; border: 1px solid #232a35;
           border-radius: 4px; padding: 2px 4px; }
  #footer { bottom: 14px; right: 14px; font-size: 10px; color: #6d7683; max-width: 320px;
            text-align: right; }
</style>
</head>
<body>
<div id="deck-container"></div>

<div id="panel" class="card">
  <h1>{{TITLE}}</h1>
  <div class="muted" id="counts"></div>
  <div id="legend"></div>
  <label class="toggle" id="pulseToggleRow" style="display:none">
    <input type="checkbox" id="pulseToggle" checked> Pulse (hourly density)
  </label>
  <label class="toggle" id="bldgToggleRow" style="display:none">
    <input type="checkbox" id="bldgToggle" checked> 3D buildings
  </label>
  <div class="muted" style="margin-top:8px">drag rotate · right-drag pan · scroll zoom</div>
</div>

<div id="controls" class="card">
  <button id="playBtn" title="Play/pause">⏸</button>
  <input id="scrub" type="range" min="0" max="86399" value="0" step="1">
  <span id="clock">00:00</span>
  <select id="speedSel" title="Simulation speed">
    <option value="30">30×</option>
    <option value="60">60×</option>
    <option value="120" selected>120×</option>
    <option value="300">300×</option>
    <option value="600">600×</option>
  </select>
</div>

<div id="footer">{{ATTRIBUTION}}</div>

<script>{{DECK_JS}}</script>
<script id="payload" type="application/json">{{PAYLOAD}}</script>
<script>
'use strict';
const P = JSON.parse(document.getElementById('payload').textContent);
const M = P.meta;

// ── base64 → typed array ────────────────────────────────────────────────
function b64(str, T) {
  const bin = atob(str);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new T(bytes.buffer);
}

// ── decode trajectories ────────────────────────────────────────────────
function decodeTrajectories() {
  const counts = b64(P.traj.counts, Uint16Array);
  const srcIdx = b64(P.traj.source, Uint8Array);
  const agentF = b64(P.traj.agent, Uint8Array);
  const starts = b64(P.traj.starts, Int32Array);
  const deltas = b64(P.traj.deltas, Int16Array);
  const tStarts = b64(P.traj.tStarts, Uint32Array);
  const tDeltas = b64(P.traj.tDeltas, Uint16Array);
  const [olon, olat] = M.origin;
  const s = M.scale;
  const out = [];
  let di = 0, agentSeen = 0;
  for (let i = 0; i < counts.length; i++) {
    const n = counts[i];
    let x = starts[i * 2], y = starts[i * 2 + 1];
    const path = [[olon + x * s, olat + y * s]];
    const ts = [tStarts[i]];
    for (let v = 1; v < n; v++) {
      x += deltas[di]; y += deltas[di + 1];
      ts.push(ts[ts.length - 1] + tDeltas[di / 2]);
      di += 2;
      path.push([olon + x * s, olat + y * s]);
    }
    const agent = agentF[i] === 1;
    out.push({
      path, timestamps: ts, s: srcIdx[i], agent,
      key: agent ? (M.agentKeys[agentSeen++] || '') : '',
    });
  }
  return out;
}

// ── decode PBLD buildings (mirror of backend/buildings_io.py) ───────────
function decodePBLD(b64str) {
  const bin = atob(b64str);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const buf = bytes.buffer;
  const view = new DataView(buf);
  const headerLen = view.getUint32(4, true);
  const header = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 8, headerLen)));
  let off = 8 + headerLen;
  const nb = header.n_buildings, nr = header.n_rings, nv = header.n_vertices;
  const scale = header.scale, olon = header.origin_lon, olat = header.origin_lat;
  const ringCounts = new Uint8Array(buf, off, nb); off += nb;
  const vertexCounts = new Uint16Array(buf.slice(off, off + nr * 2)); off += nr * 2;
  const heightsDm = new Uint16Array(buf.slice(off, off + nb * 2)); off += nb * 2;
  const ringStarts = new Int32Array(buf.slice(off, off + nr * 8)); off += nr * 8;
  const deltas = new Int16Array(buf.slice(off, off + (nv - nr) * 4));
  const out = [];
  let ri = 0, di = 0;
  for (let bi = 0; bi < nb; bi++) {
    const rings = [];
    for (let r = 0; r < ringCounts[bi]; r++) {
      const n = vertexCounts[ri];
      let x = ringStarts[ri * 2], y = ringStarts[ri * 2 + 1];
      const ring = [[olon + x * scale, olat + y * scale]];
      for (let v = 1; v < n; v++) {
        x += deltas[di]; y += deltas[di + 1]; di += 2;
        ring.push([olon + x * scale, olat + y * scale]);
      }
      rings.push(ring); ri++;
    }
    out.push({ polygon: rings, height: heightsDm[bi] / 10 });
  }
  return out;
}

// ── decode pulse hours ──────────────────────────────────────────────────
function decodePulse() {
  if (!P.pulse || !M.pulse) return null;
  const hour = b64(P.pulse.hour, Uint8Array);
  const cx = b64(P.pulse.cx, Int16Array);
  const cy = b64(P.pulse.cy, Int16Array);
  const w = b64(P.pulse.w, Uint16Array);
  const r = M.pulse.resolution;
  const [olon, olat] = M.origin;
  const hours = Array.from({ length: 24 }, () => []);
  for (let i = 0; i < hour.length; i++) {
    hours[hour[i]].push({
      position: [olon + cx[i] * r, olat + cy[i] * r],
      weight: w[i] / 65535,
    });
  }
  return hours;
}

// ── night-grid height ramp (mirror of frontend/src/buildings.ts) ───────
function heightRamp(h) {
  const hh = Math.max(h, 4);
  if (hh >= 100) return [255, 190, 80];
  const t = Math.min(Math.log(hh / 4) / Math.log(25), 1);
  if (t < 0.5) {
    const u = t / 0.5;
    return [Math.round(14 + 12 * u), Math.round(18 + 72 * u), Math.round(38 + 102 * u)];
  }
  const u = (t - 0.5) / 0.5;
  return [Math.round(26 + 34 * u), Math.round(90 + 130 * u), Math.round(140 + 115 * u)];
}

// ── position interpolation (mirror of frontend/src/utils/interpolate.ts) ─
function positionAtTime(traj, t) {
  const ts = traj.timestamps, path = traj.path;
  if (ts.length < 2) return null;
  const t0 = ts[0], tN = ts[ts.length - 1];
  if (tN < t0 || t < t0 || t > tN) return null;
  let lo = 0, hi = ts.length - 1;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (ts[mid] <= t) lo = mid; else hi = mid - 1;
  }
  if (lo >= ts.length - 1) return path[path.length - 1];
  const tA = ts[lo], tB = ts[lo + 1];
  if (tB <= tA) return path[lo];
  const f = (t - tA) / (tB - tA);
  return [path[lo][0] + (path[lo + 1][0] - path[lo][0]) * f,
          path[lo][1] + (path[lo + 1][1] - path[lo][1]) * f];
}

// ── decode everything once ──────────────────────────────────────────────
const TRAJ = decodeTrajectories();
const BUILDINGS = P.buildings ? decodePBLD(P.buildings) : null;
const PULSE = decodePulse();
const AGENTS = TRAJ.filter(t => t.agent);
const AGENT_COLORS = [[255,230,100],[0,255,200],[255,105,180],[130,200,255],
                      [255,160,40],[190,130,255],[120,255,120],[255,90,90]];
const agentIdx = {}; M.agentKeys.forEach((k, i) => { agentIdx[k] = i; });
const srcColor = i => (M.sources[i] && M.sources[i].color) || [200, 200, 200];

document.getElementById('counts').textContent =
  `${TRAJ.length.toLocaleString()} trajectories` +
  (BUILDINGS ? ` · ${BUILDINGS.length.toLocaleString()} buildings` : '');
const legend = document.getElementById('legend');
M.sources.forEach(s => {
  const row = document.createElement('div');
  row.className = 'legend-row';
  row.innerHTML = `<span class="chip" style="background:rgb(${s.color.join(',')})"></span>${s.label}`;
  legend.appendChild(row);
});
if (PULSE) document.getElementById('pulseToggleRow').style.display = 'flex';
if (BUILDINGS) document.getElementById('bldgToggleRow').style.display = 'flex';

// ── ground quad: dark plane instead of a basemap (zero tiles, zero CSP) ─
const G = 2.5;
const GROUND = [{
  polygon: [
    [M.origin[0] - G, M.origin[1] - G], [M.origin[0] + G, M.origin[1] - G],
    [M.origin[0] + G, M.origin[1] + G], [M.origin[0] - G, M.origin[1] + G],
  ],
}];

const PULSE_RANGE = [[14,18,38],[22,62,110],[24,130,170],[60,220,255],[255,190,80],[255,240,180]];
const LIGHTING = new deck.LightingEffect({
  ambient: new deck.AmbientLight({ color: [255,255,255], intensity: 0.35 }),
  directional: new deck.DirectionalLight({ color: [255,255,255], intensity: 0.9,
                                           direction: [-0.55, 0.75, -1] }),
});

let state = {
  t: 0, playing: true, speed: +document.getElementById('speedSel').value,
  pulseOn: true, bldgOn: true,
};

function buildLayers() {
  const t = state.t;
  const trail = M.loop.trail_seconds || 1500;
  const layers = [
    new deck.PolygonLayer({
      id: 'ground', data: GROUND, getPolygon: d => d.polygon,
      getFillColor: [11, 14, 19], stroked: false,
    }),
  ];
  if (BUILDINGS && state.bldgOn) {
    layers.push(new deck.PolygonLayer({
      id: 'buildings', data: BUILDINGS,
      getPolygon: d => d.polygon, extruded: true,
      getElevation: d => d.height, getFillColor: d => heightRamp(d.height),
      material: { ambient: 0.6, diffuse: 0.4, shininess: 40 },
      opacity: 0.95, stroked: false,
    }));
  }
  if (PULSE && state.pulseOn) {
    const hour = Math.floor(t / 3600) % 24, f = (t % 3600) / 3600;
    const common = {
      getPosition: d => d.position, getWeight: d => d.weight,
      radiusPixels: 40, colorRange: PULSE_RANGE, intensity: 1.2,
      threshold: 0.02, aggregation: 'SUM',
    };
    layers.push(
      new deck.HeatmapLayer({ id: 'pulse-a', data: PULSE[hour], opacity: 0.75 * (1 - f), ...common }),
      new deck.HeatmapLayer({ id: 'pulse-b', data: PULSE[(hour + 1) % 24], opacity: 0.75 * f, ...common }),
    );
  }
  layers.push(new deck.TripsLayer({
    id: 'trips', data: TRAJ,
    getPath: d => d.path, getTimestamps: d => d.timestamps,
    getColor: d => d.agent ? [0, 0, 0, 0] : srcColor(d.s),
    currentTime: t, trailLength: trail,
    widthMinPixels: 2, opacity: 0.75, jointRounded: true, capRounded: true,
    parameters: { depthCompare: 'always' },
  }));
  if (AGENTS.length) {
    layers.push(new deck.TripsLayer({
      id: 'agent-trips', data: AGENTS,
      getPath: d => d.path, getTimestamps: d => d.timestamps,
      getColor: d => AGENT_COLORS[(agentIdx[d.key] || 0) % AGENT_COLORS.length],
      currentTime: t, trailLength: trail,
      widthMinPixels: 4, opacity: 1, jointRounded: true, capRounded: true,
      parameters: { depthCompare: 'always' },
    }));
    const markers = [];
    for (const a of AGENTS) {
      const p = positionAtTime(a, t);
      if (p) markers.push({ position: p, key: a.key });
    }
    layers.push(new deck.ScatterplotLayer({
      id: 'agent-markers', data: markers,
      getPosition: d => d.position,
      getFillColor: d => AGENT_COLORS[(agentIdx[d.key] || 0) % AGENT_COLORS.length],
      getRadius: 60, radiusMinPixels: 5, radiusMaxPixels: 14,
      stroked: true, getLineColor: [255, 255, 255, 230], lineWidthMinPixels: 2,
      parameters: { depthCompare: 'always' },
    }));
  }
  return layers;
}

const deckgl = new deck.DeckGL({
  container: 'deck-container',
  initialViewState: M.camera,
  controller: true,
  layers: buildLayers(),
  effects: [LIGHTING],
  parameters: { clearColor: [0.027, 0.035, 0.047, 1] },
});

// ── animation loop ──────────────────────────────────────────────────────
const scrub = document.getElementById('scrub');
const clock = document.getElementById('clock');
const playBtn = document.getElementById('playBtn');
let last = performance.now();
function frame(now) {
  const dt = (now - last) / 1000; last = now;
  if (state.playing) state.t = (state.t + dt * state.speed) % 86400;
  scrub.value = Math.floor(state.t);
  const hh = String(Math.floor(state.t / 3600)).padStart(2, '0');
  const mm = String(Math.floor((state.t % 3600) / 60)).padStart(2, '0');
  clock.textContent = `${hh}:${mm}`;
  deckgl.setProps({ layers: buildLayers() });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

playBtn.onclick = () => {
  state.playing = !state.playing;
  playBtn.textContent = state.playing ? '⏸' : '▶';
};
scrub.oninput = e => { state.t = +e.target.value; };
document.getElementById('speedSel').onchange = e => { state.speed = +e.target.value; };
document.getElementById('pulseToggle').onchange = e => { state.pulseOn = e.target.checked; };
document.getElementById('bldgToggle').onchange = e => { state.bldgOn = e.target.checked; };
</script>
</body>
</html>
