<!DOCTYPE html>
<!--
  trajectory-viz minimal single-file export (engine:minimal).
  No deck.gl — Canvas 2D trails / agents / optional flat buildings + pulse dots.
  Generated by backend/export.py; zero network requests at runtime.
-->
<html lang="en" data-engine="minimal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  html, body { margin: 0; height: 100%; background: #07090c; overflow: hidden;
               font: 13px/1.45 "Helvetica Neue", Arial, sans-serif; color: #e8ebef; }
  #viz-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .card { position: absolute; background: rgba(13,16,21,.87); border: 1px solid #232a35;
          border-radius: 8px; padding: 10px 14px; backdrop-filter: blur(6px); z-index: 2; }
  #panel { top: 14px; left: 14px; max-width: 280px; }
  #panel h1 { font-size: 14px; margin: 0 0 2px; letter-spacing: .4px; }
  #panel .muted { color: #8b95a3; font-size: 11px; }
  .legend-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 11px; }
  .chip { width: 10px; height: 10px; border-radius: 2px; }
  label.toggle { display: flex; align-items: center; gap: 6px; margin-top: 6px;
                 font-size: 12px; cursor: pointer; }
  input[type=checkbox] { accent-color: #17b8be; }
  #controls { bottom: 14px; left: 50%; transform: translateX(-50%);
              display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
  #playBtn { background: #17b8be22; color: #4fe3e9; border: 1px solid #17b8be66;
             border-radius: 6px; width: 34px; height: 28px; cursor: pointer; font-size: 13px; }
  #scrub { width: min(420px, 40vw); accent-color: #17b8be; }
  #clock { font-family: ui-monospace, monospace; font-size: 16px; min-width: 56px; color: #4fe3e9; }
  select { background: #10151c; color: #cfd6df; border: 1px solid #232a35;
           border-radius: 4px; padding: 2px 4px; }
  #footer { bottom: 14px; right: 14px; font-size: 10px; color: #6d7683; max-width: 320px;
            text-align: right; }
  #engine-tag { margin-top: 6px; color: #5a6573; font-size: 10px; }
</style>
</head>
<body>
<canvas id="viz-canvas"></canvas>

<div id="panel" class="card">
  <h1>{{TITLE}}</h1>
  <div class="muted" id="counts"></div>
  <div id="legend"></div>
  <label class="toggle" id="pulseToggleRow" style="display:none">
    <input type="checkbox" id="pulseToggle" checked> Pulse (hourly density)
  </label>
  <label class="toggle" id="bldgToggleRow" style="display:none">
    <input type="checkbox" id="bldgToggle" checked> Buildings (flat)
  </label>
  <div class="muted" style="margin-top:8px">drag pan · scroll zoom</div>
  <div id="engine-tag">engine:minimal · no deck.gl</div>
</div>

<div id="controls" class="card">
  <button id="playBtn" title="Play/pause">⏸</button>
  <input id="scrub" type="range" min="0" max="86399" value="0" step="1">
  <span id="clock">00:00</span>
  <select id="speedSel" title="Simulation speed">
    <option value="30">30×</option>
    <option value="60">60×</option>
    <option value="120" selected>120×</option>
    <option value="300">300×</option>
    <option value="600">600×</option>
  </select>
</div>

<div id="footer" class="card">{{ATTRIBUTION}}</div>

<script id="payload" type="application/json">{{PAYLOAD}}</script>
<script>
'use strict';
/* engine:minimal */
const P = JSON.parse(document.getElementById('payload').textContent);
const M = P.meta;
const canvas = document.getElementById('viz-canvas');
const ctx = canvas.getContext('2d');

function b64(str, T) {
  const bin = atob(str);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new T(bytes.buffer);
}

function decodeTrajectories() {
  const counts = b64(P.traj.counts, Uint16Array);
  const srcIdx = b64(P.traj.source, Uint8Array);
  const agentF = b64(P.traj.agent, Uint8Array);
  const starts = b64(P.traj.starts, Int32Array);
  const deltas = b64(P.traj.deltas, Int16Array);
  const tStarts = b64(P.traj.tStarts, Uint32Array);
  const tDeltas = b64(P.traj.tDeltas, Uint16Array);
  const [olon, olat] = M.origin;
  const s = M.scale;
  const out = [];
  let di = 0, agentSeen = 0;
  for (let i = 0; i < counts.length; i++) {
    const n = counts[i];
    let x = starts[i * 2], y = starts[i * 2 + 1];
    const path = [[olon + x * s, olat + y * s]];
    const ts = [tStarts[i]];
    for (let v = 1; v < n; v++) {
      x += deltas[di]; y += deltas[di + 1];
      ts.push(ts[ts.length - 1] + tDeltas[di / 2]);
      di += 2;
      path.push([olon + x * s, olat + y * s]);
    }
    const agent = agentF[i] === 1;
    out.push({
      path, timestamps: ts, s: srcIdx[i], agent,
      key: agent ? (M.agentKeys[agentSeen++] || '') : '',
    });
  }
  return out;
}

function decodePBLD(b64str) {
  const bin = atob(b64str);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const buf = bytes.buffer;
  const view = new DataView(buf);
  const headerLen = view.getUint32(4, true);
  const header = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 8, headerLen)));
  let off = 8 + headerLen;
  const nb = header.n_buildings, nr = header.n_rings, nv = header.n_vertices;
  const scale = header.scale, olon = header.origin_lon, olat = header.origin_lat;
  const ringCounts = new Uint8Array(buf, off, nb); off += nb;
  const vertexCounts = new Uint16Array(buf.slice(off, off + nr * 2)); off += nr * 2;
  const heightsDm = new Uint16Array(buf.slice(off, off + nb * 2)); off += nb * 2;
  const ringStarts = new Int32Array(buf.slice(off, off + nr * 8)); off += nr * 8;
  const deltas = new Int16Array(buf.slice(off, off + (nv - nr) * 4));
  const out = [];
  let ri = 0, di = 0;
  for (let bi = 0; bi < nb; bi++) {
    const rings = [];
    for (let r = 0; r < ringCounts[bi]; r++) {
      const n = vertexCounts[ri];
      let x = ringStarts[ri * 2], y = ringStarts[ri * 2 + 1];
      const ring = [[olon + x * scale, olat + y * scale]];
      for (let v = 1; v < n; v++) {
        x += deltas[di]; y += deltas[di + 1]; di += 2;
        ring.push([olon + x * scale, olat + y * scale]);
      }
      rings.push(ring); ri++;
    }
    out.push({ polygon: rings, height: heightsDm[bi] / 10 });
  }
  return out;
}

function decodePulse() {
  if (!P.pulse || !M.pulse) return null;
  const hour = b64(P.pulse.hour, Uint8Array);
  const cx = b64(P.pulse.cx, Int16Array);
  const cy = b64(P.pulse.cy, Int16Array);
  const w = b64(P.pulse.w, Uint16Array);
  const r = M.pulse.resolution;
  const [olon, olat] = M.origin;
  const hours = Array.from({ length: 24 }, () => []);
  for (let i = 0; i < hour.length; i++) {
    hours[hour[i]].push({
      position: [olon + cx[i] * r, olat + cy[i] * r],
      weight: w[i] / 65535,
    });
  }
  return hours;
}

function positionAtTime(traj, t) {
  const ts = traj.timestamps, path = traj.path;
  if (ts.length < 2) return null;
  const t0 = ts[0], tN = ts[ts.length - 1];
  if (tN < t0 || t < t0 || t > tN) return null;
  let lo = 0, hi = ts.length - 1;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (ts[mid] <= t) lo = mid; else hi = mid - 1;
  }
  if (lo >= ts.length - 1) return path[path.length - 1];
  const tA = ts[lo], tB = ts[lo + 1];
  if (tB <= tA) return path[lo];
  const f = (t - tA) / (tB - tA);
  return [path[lo][0] + (path[lo + 1][0] - path[lo][0]) * f,
          path[lo][1] + (path[lo + 1][1] - path[lo][1]) * f];
}

const TRAJ = decodeTrajectories();
const BUILDINGS = P.buildings ? decodePBLD(P.buildings) : null;
const PULSE = decodePulse();
const AGENTS = TRAJ.filter(t => t.agent);
const AGENT_COLORS = [[255,230,100],[0,255,200],[255,105,180],[130,200,255],
                      [255,160,40],[190,130,255],[120,255,120],[255,90,90]];
const agentIdx = {}; M.agentKeys.forEach((k, i) => { agentIdx[k] = i; });
const srcColor = i => (M.sources[i] && M.sources[i].color) || [200, 200, 200];

document.getElementById('counts').textContent =
  `${TRAJ.length.toLocaleString()} trajectories` +
  (BUILDINGS ? ` · ${BUILDINGS.length.toLocaleString()} buildings` : '') +
  ' · minimal';
const legend = document.getElementById('legend');
M.sources.forEach(s => {
  const row = document.createElement('div');
  row.className = 'legend-row';
  const chip = document.createElement('span');
  chip.className = 'chip';
  chip.style.background = 'rgb(' + s.color.join(',') + ')';
  row.appendChild(chip);
  row.appendChild(document.createTextNode(s.label));
  legend.appendChild(row);
});
if (PULSE) document.getElementById('pulseToggleRow').style.display = 'flex';
if (BUILDINGS) document.getElementById('bldgToggleRow').style.display = 'flex';

// ── camera / projection (simple equirect + pitch foreshortening) ─────────
const cam = Object.assign({
  longitude: M.origin[0] + 0.1, latitude: M.origin[1] + 0.1,
  zoom: 10.5, pitch: 50, bearing: 0,
}, M.camera || {});

let view = {
  lon: cam.longitude, lat: cam.latitude,
  zoom: cam.zoom, pitch: cam.pitch || 0, bearing: cam.bearing || 0,
};

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(window.innerWidth * dpr);
  canvas.height = Math.floor(window.innerHeight * dpr);
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

function project(lon, lat) {
  const w = window.innerWidth, h = window.innerHeight;
  const scale = Math.pow(2, view.zoom) * 256 / 360;
  let x = (lon - view.lon) * scale;
  let y = (view.lat - lat) * scale;
  const br = view.bearing * Math.PI / 180;
  const cos = Math.cos(br), sin = Math.sin(br);
  const rx = x * cos - y * sin;
  const ry = x * sin + y * cos;
  const pitch = Math.max(0, Math.min(70, view.pitch)) * Math.PI / 180;
  const fy = Math.cos(pitch);
  return [w / 2 + rx, h / 2 + ry * fy];
}

let state = {
  t: 0, playing: true, speed: +document.getElementById('speedSel').value,
  pulseOn: true, bldgOn: true,
};

function rgba(c, a) {
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}

function drawTrail(traj, t, trail, color, width) {
  const ts = traj.timestamps, path = traj.path;
  if (ts.length < 2) return;
  const t0 = Math.max(ts[0], t - trail);
  const t1 = Math.min(ts[ts.length - 1], t);
  if (t1 < t0) return;
  ctx.lineWidth = width;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  let started = false;
  for (let i = 0; i < path.length - 1; i++) {
    const a = ts[i], b = ts[i + 1];
    if (b < t0 || a > t1) continue;
    const p0 = project(path[i][0], path[i][1]);
    const p1 = project(path[i + 1][0], path[i + 1][1]);
    const age = (t - Math.min(b, t1)) / trail;
    const alpha = Math.max(0.08, 1 - age);
    ctx.strokeStyle = rgba(color, alpha * 0.85);
    ctx.beginPath();
    ctx.moveTo(p0[0], p0[1]);
    ctx.lineTo(p1[0], p1[1]);
    ctx.stroke();
    started = true;
  }
  return started;
}

function draw() {
  const w = window.innerWidth, h = window.innerHeight;
  ctx.fillStyle = '#07090c';
  ctx.fillRect(0, 0, w, h);

  // faint ground grid
  ctx.strokeStyle = 'rgba(35,42,53,0.55)';
  ctx.lineWidth = 1;
  const step = Math.pow(2, Math.max(0, 12 - view.zoom)) * 0.01;
  const lon0 = view.lon - 0.4, lon1 = view.lon + 0.4;
  const lat0 = view.lat - 0.4, lat1 = view.lat + 0.4;
  for (let lon = Math.floor(lon0 / step) * step; lon <= lon1; lon += step) {
    const a = project(lon, lat0), b = project(lon, lat1);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  }
  for (let lat = Math.floor(lat0 / step) * step; lat <= lat1; lat += step) {
    const a = project(lon0, lat), b = project(lon1, lat);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  }

  if (BUILDINGS && state.bldgOn) {
    for (const b of BUILDINGS) {
      const ring = b.polygon[0];
      if (!ring || ring.length < 3) continue;
      const elev = Math.min(1, (b.height || 10) / 80);
      ctx.fillStyle = `rgba(${14 + elev * 40},${18 + elev * 70},${38 + elev * 100},0.75)`;
      ctx.beginPath();
      const p0 = project(ring[0][0], ring[0][1]);
      ctx.moveTo(p0[0], p0[1]);
      for (let i = 1; i < ring.length; i++) {
        const p = project(ring[i][0], ring[i][1]);
        ctx.lineTo(p[0], p[1]);
      }
      ctx.closePath();
      ctx.fill();
    }
  }

  if (PULSE && state.pulseOn) {
    const hour = Math.floor(state.t / 3600) % 24;
    const cells = PULSE[hour] || [];
    for (const c of cells) {
      const p = project(c.position[0], c.position[1]);
      const r = 4 + c.weight * 18;
      ctx.fillStyle = `rgba(60,220,255,${0.08 + c.weight * 0.35})`;
      ctx.beginPath();
      ctx.arc(p[0], p[1], r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  const trail = (M.loop && M.loop.trail_seconds) || 1500;
  for (const traj of TRAJ) {
    if (traj.agent) continue;
    drawTrail(traj, state.t, trail, srcColor(traj.s), 2);
  }
  for (const a of AGENTS) {
    const c = AGENT_COLORS[(agentIdx[a.key] || 0) % AGENT_COLORS.length];
    drawTrail(a, state.t, trail, c, 3.5);
    const p = positionAtTime(a, state.t);
    if (p) {
      const xy = project(p[0], p[1]);
      ctx.fillStyle = rgba(c, 1);
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(xy[0], xy[1], 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
  }
}

// ── interaction ─────────────────────────────────────────────────────────
let dragging = false, lastX = 0, lastY = 0;
canvas.addEventListener('pointerdown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointerup', () => { dragging = false; });
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const scale = Math.pow(2, view.zoom) * 256 / 360;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  const pitch = Math.max(0.2, Math.cos(view.pitch * Math.PI / 180));
  view.lon -= dx / scale;
  view.lat += dy / (scale * pitch);
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  view.zoom = Math.max(8, Math.min(18, view.zoom - Math.sign(e.deltaY) * 0.25));
}, { passive: false });

const scrub = document.getElementById('scrub');
const clock = document.getElementById('clock');
const playBtn = document.getElementById('playBtn');
let last = performance.now();
function frame(now) {
  const dt = (now - last) / 1000; last = now;
  if (state.playing) state.t = (state.t + dt * state.speed) % 86400;
  scrub.value = Math.floor(state.t);
  const hh = String(Math.floor(state.t / 3600)).padStart(2, '0');
  const mm = String(Math.floor((state.t % 3600) / 60)).padStart(2, '0');
  clock.textContent = `${hh}:${mm}`;
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

playBtn.onclick = () => {
  state.playing = !state.playing;
  playBtn.textContent = state.playing ? '⏸' : '▶';
};
scrub.oninput = e => { state.t = +e.target.value; };
document.getElementById('speedSel').onchange = e => { state.speed = +e.target.value; };
document.getElementById('pulseToggle').onchange = e => { state.pulseOn = e.target.checked; };
document.getElementById('bldgToggle').onchange = e => { state.bldgOn = e.target.checked; };
</script>
</body>
</html>
