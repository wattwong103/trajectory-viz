# Paper / email export — small, demo-DB friendly (default product path).
#
# workflow: paper → engine: minimal by default (no vendor fetch).
# Override with --engine deck if you want app-matching WebGL visuals.
#
#   trajectory-viz-demo --ensure
#   viz-export --preset presets/demo-paper.yaml --db demo/demo.duckdb \
#              --out exports/demo-paper.html
#   viz-export --list-presets
#
# forms: gates baking — trails only (no pulse / buildings / agents) keeps
# the HTML tiny for paper figures & light attachments. See docs/EXPORT.md.

title: "Kichijōji Couriers — Paper"
workflow: paper
engine: minimal
use: "Paper figures, email, light offline attachment"

forms:
  - trail

filters:
  vehicle_type: courier

sample_n: 24

include:
  pulse: false

camera:
  longitude: 139.580
  latitude: 35.703
  zoom: 13.5
  pitch: 45
  bearing: -20

loop:
  speed: 90
  trail_seconds: 900
