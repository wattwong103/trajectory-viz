# Slide-deck / collaborator hand-off — demo DB with trails + agents + pulse.
#
# workflow: deck → engine: deck (inlined deck.gl; fetch vendor once).
# For a lighter attachment use demo-paper.yaml or pass --engine minimal.
#
#   trajectory-viz-demo --ensure
#   python scripts/fetch_vendor.py
#   viz-export --preset presets/demo-deck.yaml --db demo/demo.duckdb \
#              --out exports/demo-deck.html
#   viz-export --list-presets

title: "Kichijōji Day — Deck"
workflow: deck
engine: deck
use: "Richer slide / collaborator hand-off (agents + pulse)"

forms:
  - trail
  - agents
  - pulse

filters:
  vehicle_type: courier

sample_n: 48

agents:
  - "courier:courier-01"
  - "courier:courier-05"

include:
  pulse: true

camera:
  longitude: 139.580
  latitude: 35.703
  zoom: 13.2
  pitch: 50
  bearing: -15

loop:
  speed: 120
  trail_seconds: 1200
