# Universal reference registry (Phase D default product profile).
#
# Multi-format / multi-mode demo around Kichijōji, Tokyo — the out-of-box
# discovery path when TRAJECTORY_VIZ_PROFILE is unset. Lab packs live under
# profiles/pflow/ (opt-in: TRAJECTORY_VIZ_PROFILE=pflow).
#
# Globs resolve relative to PFLOW_VIZ_OUTPUT_ROOT / TRAJECTORY_VIZ_OUTPUT_ROOT,
# which backend/demo.py (and Phase D defaults) set to this demo/ directory.
#
# Validate:
#   python -m backend.sources_schema --validate demo/sources.demo.yaml

version: 1

# Per-DB absolute-time anchor (stored in viz_meta on first ingest). Both
# waypoint sources map their ISO timestamps against this anchor; OD trips use
# starttime seconds-from-midnight on the same day.
time:
  epoch_anchor: "2024-03-01T00:00:00+09:00"

sources:
  # Bike couriers — GPX tracks, no trip boundaries. Trips are synthesized at
  # ingest via gap_split: each courier's >25 min lunch break yields 2 trips.
  couriers:
    label: "Bike Couriers (GPX)"
    source_id: courier
    discovery:
      trajectories_glob: "gps/couriers/*.gpx"
      latest_only: false
    vehicle_key_template: "courier:{vehicle_id}"
    trips_synthesis: { strategy: gap_split, gap_minutes: 20 }
    forms: [trail, agents, heatmap, temporal]
    render:
      mode: trails
      color: [255, 200, 60]
    columns:
      vehicle_id_col: _trk_name   # GPX <trk><name>; string ids hash-fallback
      waypoints:
        unix_time_ms: { csv: _time_ms, type: bigint }
        lon:          { csv: _lon,     type: double }
        lat:          { csv: _lat,     type: double }

  # City buses — GeoJSON LineStrings with per-coordinate times in the
  # 'coordTimes' property. One continuous run per bus → 1 trip each.
  buses:
    label: "City Buses (GeoJSON)"
    source_id: bus
    discovery:
      trajectories_glob: "transit/buses.geojson"
      latest_only: false
    vehicle_key_template: "bus:{vehicle_id}"
    trips_synthesis: { strategy: gap_split, gap_minutes: 20 }
    forms: [trail, agents, heatmap, temporal]
    time:
      coord_times_prop: coordTimes
    render:
      mode: trails
      color: [80, 170, 255]
    columns:
      vehicle_id_col: bus_id      # flattened GeoJSON property (string)
      waypoints:
        unix_time_ms: { csv: _time_ms, type: bigint }
        lon:          { csv: _lon,     type: double }
        lat:          { csv: _lat,     type: double }

  # Trips-only OD CSV — string mode labels, no waypoints → OD arcs.
  od-flows:
    label: "Local OD Arcs (CSV)"
    source_id: od
    discovery:
      trips_glob: "od/trips_od.csv"
      latest_only: false
    vehicle_key_template: "od:{vehicle_id}"
    forms: [od-arcs, od-endpoints, temporal, heatmap]
    render:
      mode: arcs
      color: [255, 140, 90]
    columns:
      trip_id_col: trip_id
      vehicle_id_col: agent_id
      trips:
        starttime:      { csv: starttime,   type: int }
        start_lon:      { csv: start_lon,   type: double }
        start_lat:      { csv: start_lat,   type: double }
        end_lon:        { csv: end_lon,     type: double }
        end_lat:        { csv: end_lat,     type: double }
        mode:           { csv: mode,        type: varchar }
        distance_km:    { csv: distance_km, type: double }
        dep_hour:       { derived: "CAST(starttime / 3600 AS INTEGER)" }
        simulation_day: { csv: sim_day,     type: int }

# Static POI layer — stations / malls / parks around Kichijoji.
pois:
  places:
    label: "Kichijoji Places"
    glob: "pois/stations.geojson"
    color: [120, 220, 140]
    columns:
      name:     { csv: name,     type: varchar }
      category: { csv: category, type: varchar }
      lon:      { csv: _lon,     type: double }
      lat:      { csv: _lat,     type: double }
