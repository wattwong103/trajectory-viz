# Example sources.yaml for MATSim events → CSV (scripts-first; no FormatType).
#
# ── First useful view (tiny fixture, ~5 seconds) ─────────────────────────
#   python scripts/lab_abm_demo.py
#   # or step-by-step:
#   python scripts/matsim_events_to_csv.py tests/fixtures/adapters/matsim_events_tiny.xml \
#       -o demo/abm/matsim/berlin/iter_001 \
#       --network tests/fixtures/adapters/matsim_network_tiny.xml \
#       --epoch-ms 1717167600000
#   trajectory-viz-ingest --sources demo/abm/sources.yaml \
#       --output-root demo/abm --db-path demo/abm/abm.duckdb --reset
#
# Adapter writes trips_car.csv + events_car_geo.csv. Pass --epoch-ms matching
# time.epoch_anchor so waypoint trails share the trip clock. Without a
# network.xml, geo events are skipped (trips-only → arcs).
#
# Other post-processors (matsim2osm, ARENA, …) also work — adapt columns.
# PT: the in-repo adapter emits car/walk legs only; map PT CSVs yourself
# (see commented block at bottom).
#
# Validate:
#   python -m backend.sources_schema --validate docs/examples/sources-matsim.yaml

version: 1
scale: micro

time:
  # Match adapter --epoch-ms 1717167600000 (= 2024-06-01T00:00:00+09:00).
  epoch_anchor: "2024-06-01T00:00:00+09:00"

sources:

  # ─────────────────────────────────────────────────────────────────────────
  # MATSim car / walk legs — adapter output (person_id + link centroids).
  # ─────────────────────────────────────────────────────────────────────────
  matsim-car:
    label: "MATSim Car (Berlin scenario)"
    source_id: car                          # collides with future bus/bike sources;
                                            # use a more-specific id if you have them
    discovery:
      # Convention: post-processor writes one CSV per scenario × iteration.
      # We pick the latest iteration via the iter_* dir.
      trips_glob: "matsim/berlin/iter_*/trips_car.csv"
      trajectories_glob: "matsim/berlin/iter_*/events_car_geo.csv"
      latest_only: true
      scope: { value: berlin }              # multi-scenario? Duplicate this block
                                            # per scenario with different scope values
    vehicle_key_template: "car:{scope}:{vehicle_id}"
    render:
      mode: trails
      color: [200, 80, 60]
    columns:
      trip_id_col: trip_id                  # MATSim's trip_id (post-processor output)
      vehicle_id_col: person_id             # MATSim agents are persons, not vehicles
      trips:
        # Core required columns. Note: MATSim often emits start/end coords in a
        # projected CRS (e.g. EPSG:31468 for Berlin); convert to WGS84 in the
        # post-processor or via a `derived:` SQL expression below.
        # The in-repo tiny fixture already uses lon/lat degrees.
        starttime:       { csv: start_time_sec,    type: int }
        start_lon:       { csv: start_lon_wgs84,   type: double }
        start_lat:       { csv: start_lat_wgs84,   type: double }
        end_lon:         { csv: end_lon_wgs84,     type: double }
        end_lat:         { csv: end_lat_wgs84,     type: double }
        # Optional — Phase C canonical string mode (not int transport_mode).
        mode:            { csv: mode,             type: varchar }  # MATSim mode string
        distance_km:     { csv: trip_length_m,    type: double,
                           transform: "value / 1000.0" }
        dep_hour:        { derived: "CAST(start_time_sec / 3600 AS INTEGER)" }
        # MATSim doesn't model goods or cargo by default; leave those columns NULL.
      waypoints:
        # Each row is one LinkEnter/Leave event with link geometry centroid.
        # time_ms must be absolute epoch ms (adapter --epoch-ms).
        unix_time_ms:    { csv: time_ms,    type: bigint }
        lon:             { csv: lon_wgs84,  type: double }
        lat:             { csv: lat_wgs84,  type: double }
        link_id:         { csv: link_id,    type: varchar }   # MATSim network link id
        mode:            { csv: mode,       type: varchar }

