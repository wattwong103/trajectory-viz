name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ──────────────────────────────────────────────────────────────────────
  # backend: pytest + ruff against Python 3.11/3.12
  # Runs on every push/PR — fast (<1 minute typical).
  # ──────────────────────────────────────────────────────────────────────
  backend:
    name: Backend (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check backend/ tests/

      - name: Unit tests (pytest)
        run: pytest tests/ -v
        env:
          # Tests use synthetic CSVs + in-memory DuckDB; PFLOW_HOME is not
          # required, but set it so config.get_pflow_home() never warns.
          PFLOW_HOME: /tmp/fake-pflow-home

  # ──────────────────────────────────────────────────────────────────────
  # frontend: TypeScript build + (when available) vitest
  # The `npm run build` step is the load-bearing TS gate.
  # ──────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build (tsc + vite)
        working-directory: frontend
        run: npm run build

      - name: Test (vitest, if configured)
        working-directory: frontend
        # Don't fail CI if vitest isn't installed yet; do fail if it is and the
        # tests break. The `|| code 1` discrimination is what makes this safe.
        run: |
          if npm run | grep -q '^  test$'; then
            npm test
          else
            echo "vitest not yet configured; skipping (see docs/CONTRIBUTING.md → Testing)"
          fi

  # ──────────────────────────────────────────────────────────────────────
  # docker: build the image, run it, curl the health endpoint.
  # Heaviest job (~3-5 min). Skip if no Docker-relevant files changed.
  # ──────────────────────────────────────────────────────────────────────
  docker:
    name: Docker (build + smoke)
    runs-on: ubuntu-latest
    needs: [backend, frontend]    # don't waste Docker cycles if basics fail
    steps:
      - uses: actions/checkout@v4

      - name: Setup Buildx (layer caching)
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          tags: trajectory-viz:ci
          load: true                    # load into local docker daemon for the smoke step
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (empty DB)
        # The image's CMD invokes trajectory-viz-serve which fails-soft when
        # PFLOW_VIZ_DB doesn't exist (creates an empty DuckDB and serves it).
        # We just need to confirm the container starts and /api/stats responds.
        run: |
          docker run -d --name ci-trajectory-viz \
            -p 8080:8080 \
            -e PFLOW_VIZ_DB=/tmp/ci.duckdb \
            trajectory-viz:ci
          # Wait for healthcheck. The image's HEALTHCHECK polls every 30s but
          # we hit /api/stats directly with a polling loop for speed.
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/api/stats > /dev/null; then
              echo "Container ready after ${i}s"
              break
            fi
            sleep 1
          done
          # Final hit — fail the job if still not responding
          curl -sf http://127.0.0.1:8080/api/stats | tee /dev/stderr | grep -q '"trips"'
          # And /api/stats/filter-options shape
          curl -sf http://127.0.0.1:8080/api/stats/filter-options | tee /dev/stderr | grep -q 'vehicle_types'
          docker stop ci-trajectory-viz

  # ──────────────────────────────────────────────────────────────────────
  # sources-yaml-examples: validate that every YAML under docs/examples/
  # still parses under the current schema. Catches schema drift breaking
  # the contributed-config examples.
  # ──────────────────────────────────────────────────────────────────────
  sources-examples:
    name: Validate sources.yaml examples
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .

      - name: Validate canonical sources.yaml
        run: python -m backend.sources_schema --validate sources.yaml

      - name: Validate docs/examples/*.yaml
        run: |
          for f in docs/examples/sources-*.yaml; do
            echo "::group::$f"
            python -m backend.sources_schema --validate "$f"
            echo "::endgroup::"
          done
