name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ──────────────────────────────────────────────────────────────────────
  # backend: pytest + ruff against Python 3.11/3.12
  # Runs on every push/PR — fast (<1 minute typical).
  # ──────────────────────────────────────────────────────────────────────
  backend:
    name: Backend (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check backend/ tests/

      - name: Unit tests (pytest)
        run: pytest tests/ -v
        env:
          # Tests use synthetic CSVs + in-memory DuckDB; PFLOW_HOME is not
          # required, but set it so config.get_pflow_home() never warns.
          PFLOW_HOME: /tmp/fake-pflow-home

      - name: Export CLI smoke (stub vendor, no network)
        # Builds a synthetic on-disk DB, stubs the deck.gl bundle, runs the
        # real `viz-export` CLI, and asserts the output has zero external URLs.
        # The packing/template logic is unit-tested in test_export.py; this
        # step covers the CLI wiring + preset path end-to-end.
        run: |
          mkdir -p scripts/vendor exports
          printf 'window.deck=window.deck||{};/* ci stub */' > scripts/vendor/deck.gl.min.js
          python - <<'PY'
          import duckdb, tempfile
          from pathlib import Path
          from tests.test_endpoints import _populate_db
          tmp = Path(tempfile.mkdtemp()); db = tmp / "ci.duckdb"
          c = duckdb.connect(str(db)); _populate_db(c, tmp); c.close()
          Path("exports/.ci_db").write_text(str(db))
          PY
          python -m backend.export --db "$(cat exports/.ci_db)" \
            --vehicle-type truck --n 10 --no-pulse --out exports/ci.html
          test -s exports/ci.html
          if grep -Eq 'https?://' exports/ci.html; then
            echo "ERROR: export contains external URLs" >&2; exit 1
          fi
          echo "Export smoke OK ($(wc -c < exports/ci.html) bytes)"
        env:
          PFLOW_HOME: /tmp/fake-pflow-home

  # ──────────────────────────────────────────────────────────────────────
  # frontend: TypeScript build + (when available) vitest
  # The `npm run build` step is the load-bearing TS gate.
  # ──────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build (tsc + vite)
        working-directory: frontend
        run: npm run build

      - name: Test (vitest, if configured)
        working-directory: frontend
        # Don't fail CI if vitest isn't installed yet; do fail if it is and the
        # tests break. The `|| code 1` discrimination is what makes this safe.
        run: |
          if npm run | grep -q '^  test$'; then
            npm test
          else
            echo "vitest not yet configured; skipping (see docs/CONTRIBUTING.md → Testing)"
          fi

  # ──────────────────────────────────────────────────────────────────────
  # docker: build the image, run it, curl the health endpoint.
  # Heaviest job (~3-5 min). Skip if no Docker-relevant files changed.
  # ──────────────────────────────────────────────────────────────────────
  docker:
    name: Docker (build + smoke)
    runs-on: ubuntu-latest
    needs: [backend, frontend]    # don't waste Docker cycles if basics fail
    steps:
      - uses: actions/checkout@v4

      - name: Setup Buildx (layer caching)
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          tags: trajectory-viz:ci
          load: true                    # load into local docker daemon for the smoke step
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (demo happy path)
        # Default image path: baked demo DB + built UI. Prove first-run shows
        # trips and serves the map HTML (not API-only JSON at /).
        run: |
          docker run -d --name ci-trajectory-viz \
            -p 8080:8080 \
            trajectory-viz:ci
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:8080/api/stats > /dev/null; then
              echo "Container ready after ${i}s"
              break
            fi
            sleep 1
          done
          STATS=$(curl -sf http://127.0.0.1:8080/api/stats)
          echo "$STATS" | tee /dev/stderr | grep -q '"trips"'
          printf '%s' "$STATS" | python3 -c '
          import json, sys
          body = json.load(sys.stdin)
          n = body.get("trips", {}).get("row_count", 0)
          assert n > 0, f"expected demo trips, got {body!r}"
          assert not body.get("empty_hint"), body.get("empty_hint")
          print(f"demo trips OK ({n})")
          '
          curl -sf http://127.0.0.1:8080/api/stats/filter-options | tee /dev/stderr | grep -q 'vehicle_types'
          # Map UI (StaticFiles) — must be HTML, not the API-only JSON note.
          curl -sf -D /tmp/ci-root.hdr -o /tmp/ci-root.body http://127.0.0.1:8080/
          head -n 20 /tmp/ci-root.hdr
          grep -qi 'text/html' /tmp/ci-root.hdr
          grep -qiE '<html|<!doctype html' /tmp/ci-root.body
          docker stop ci-trajectory-viz

      - name: Smoke test (empty DB stays honest)
        # SEED_DEMO=0 + fresh path → schema-only / empty; empty_hint present.
        run: |
          docker run -d --name ci-trajectory-viz-empty \
            -p 8081:8080 \
            -e TRAJECTORY_VIZ_DB=/tmp/ci-empty.duckdb \
            -e PFLOW_VIZ_DB=/tmp/ci-empty.duckdb \
            -e TRAJECTORY_VIZ_SEED_DEMO=0 \
            trajectory-viz:ci
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:8081/api/stats > /dev/null; then
              echo "Empty container ready after ${i}s"
              break
            fi
            sleep 1
          done
          STATS=$(curl -sf http://127.0.0.1:8081/api/stats)
          echo "$STATS" | tee /dev/stderr
          printf '%s' "$STATS" | python3 -c '
          import json, sys
          body = json.load(sys.stdin)
          n = body.get("trips", {}).get("row_count", 0)
          assert n == 0, body
          assert body.get("empty_hint"), "expected empty_hint on zero-trip DB"
          print("empty_hint OK")
          '
          docker stop ci-trajectory-viz-empty

  # ──────────────────────────────────────────────────────────────────────
  # sources-yaml-examples: validate that every YAML under docs/examples/
  # still parses under the current schema. Catches schema drift breaking
  # the contributed-config examples.
  # ──────────────────────────────────────────────────────────────────────
  sources-examples:
    name: Validate sources.yaml examples
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .

      - name: Validate demo + profile registries
        run: |
          for f in demo/sources.demo.yaml \
                   profiles/pflow/sources.yaml \
                   profiles/pflow/sources.kichijoji.yaml \
                   profiles/gufm/sources.yaml; do
            echo "::group::$f"
            python -m backend.sources_schema --validate "$f"
            echo "::endgroup::"
          done

      - name: Validate docs/examples/*.yaml
        run: |
          for f in docs/examples/sources-*.yaml; do
            echo "::group::$f"
            python -m backend.sources_schema --validate "$f"
            echo "::endgroup::"
          done
