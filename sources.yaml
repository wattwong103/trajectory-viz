# trajectory-viz source registry.
#
# Each entry under `sources:` declares one agent-based-model output that the
# dashboard can ingest. The key (e.g. `pflow-truck`) is unique; multiple keys
# may share a `source_id` (e.g. all taxi cities share source_id=taxi).
#
# Validate this file:
#   python -m backend.sources_schema --validate sources.yaml
#
# Dry-run discovery (counts matching CSVs under PFLOW_VIZ_OUTPUT_ROOT):
#   python -m backend.sources_schema --discovery sources.yaml --output-root /path/to/output
#
# Schema reference: see backend/sources_schema.py.

version: 1

sources:
  # ─────────────────────────────────────────────────────────────────────────
  # PFLOW Truck (Kanto, MFS-calibrated)
  # ─────────────────────────────────────────────────────────────────────────
  pflow-truck:
    label: "PFLOW Truck (Kanto)"
    source_id: truck
    discovery:
      trips_glob: "trips/truck/run_*/trips_pseudo_pflow.csv"
      trajectories_glob: "trajectory/truck/**/waypoints.csv"
      latest_only: true
      validation_relative: "validation.csv"
    vehicle_key_template: "truck:{vehicle_id}"
    render:
      mode: trails
      color: [253, 128, 93]
    columns:
      trip_id_col: id
      vehicle_id_col: truck_id
      trips:
        starttime:       { csv: starttime,      type: int }
        start_lon:       { csv: start_lon,      type: double }
        start_lat:       { csv: start_lat,      type: double }
        end_lon:         { csv: end_lon,        type: double }
        end_lat:         { csv: end_lat,        type: double }
        transport_mode:  { csv: transport_mode, type: int }
        purpose:         { csv: purpose,        type: int }
        distance_km:     { csv: distance_km,    type: double }
        dep_hour:        { derived: "CAST(starttime / 3600 AS INTEGER)" }
        simulation_day:  { csv: sim_day,        type: int }
        goods_type:      { csv: goods_type,     type: varchar }
        vehicle_size:    { csv: vehicle_size,   type: varchar }
        cargo_loaded:    { csv: cargo_loaded,   type: bool, transform: "lower(CAST(value AS VARCHAR)) = 'true'" }
      waypoints:
        unix_time_ms:    { csv: unix_time_ms,   type: bigint }
        lon:             { csv: lon,            type: double }
        lat:             { csv: lat,            type: double }
        link_id:         { csv: link_id,        type: varchar }
        transport_mode:  { csv: transport_mode, type: int }
        purpose:         { csv: purpose,        type: int }
        goods_type:      { csv: goods_type,     type: varchar }
        vehicle_size:    { csv: vehicle_size,   type: varchar }

  # ─────────────────────────────────────────────────────────────────────────
  # PFLOW Taxi — Tokyo (THTA-calibrated)
  # Add additional cities (osaka, kanagawa, ...) by copying this block and
  # changing `scope`, the discovery globs, and the key.
  # ─────────────────────────────────────────────────────────────────────────
  # ─────────────────────────────────────────────────────────────────────────
  # PFLOW Person — shopping trips (23 Tokyo special wards, purpose=100)
  # Generated by analysis/gen_shopping_trips_csv.py
  # Routed via TrajectoryMain taxi (DRM pref 13, maxRoadClass=9)
  # ─────────────────────────────────────────────────────────────────────────
  pflow-person-shopping:
    label: "Person Shopping (Tokyo 23 wards)"
    source_id: person
    discovery:
      trips_glob: "trips/person/shopping/trips_pseudo_pflow.csv"
      trajectories_glob: "trajectory/person/shopping/trajectory_*.csv"
      latest_only: false
    vehicle_key_template: "person:{vehicle_id}"
    render:
      mode: points
      color: [43, 200, 80]
    columns:
      trip_id_col: id
      vehicle_id_col: taxi_id
      trips:
        starttime:       { csv: starttime,      type: int }
        start_lon:       { csv: start_lon,      type: double }
        start_lat:       { csv: start_lat,      type: double }
        end_lon:         { csv: end_lon,        type: double }
        end_lat:         { csv: end_lat,        type: double }
        transport_mode:  { csv: transport_mode, type: int }
        purpose:         { csv: purpose,        type: int }
        distance_km:     { csv: distance_km,    type: double }
        dep_hour:        { derived: "CAST(starttime / 3600 AS INTEGER)" }
        simulation_day:  { csv: simulation_day, type: int }
      waypoints:
        unix_time_ms:    { csv: unix_time_ms,   type: bigint }
        lon:             { csv: lon,            type: double }
        lat:             { csv: lat,            type: double }
        link_id:         { csv: link_id,        type: varchar }
        transport_mode:  { csv: transport_mode, type: int }
        purpose:         { csv: purpose,        type: int }

  pflow-taxi-tokyo:
    label: "Tokyo Taxi"
    source_id: taxi
    discovery:
      trips_glob: "trips/taxi/tokyo/run_*/trips_pseudo_pflow.csv"
      trajectories_glob: "trajectory/taxi/tokyo/**/waypoints.csv"
      latest_only: true
      scope: { value: tokyo }
      validation_relative: "validation.csv"
    vehicle_key_template: "taxi:{scope}:{vehicle_id}"
    render:
      mode: trails
      color: [23, 184, 190]
    columns:
      trip_id_col: id
      vehicle_id_col: taxi_id
      trips:
        starttime:       { csv: starttime,      type: int }
        start_lon:       { csv: start_lon,      type: double }
        start_lat:       { csv: start_lat,      type: double }
        end_lon:         { csv: end_lon,        type: double }
        end_lat:         { csv: end_lat,        type: double }
        transport_mode:  { csv: transport_mode, type: int }
        purpose:         { csv: purpose,        type: int }
        distance_km:     { csv: distance_km,    type: double }
        dep_hour:        { derived: "CAST(EXTRACT(HOUR FROM CAST(starttime_h AS TIMESTAMP)) AS INTEGER)" }
        simulation_day:  { csv: simulation_day, type: int }
        fare_yen:        { csv: fare_yen,       type: double }
        is_night_trip:   { csv: is_night_trip,  type: bool, transform: "lower(CAST(value AS VARCHAR)) = 'true'" }
        passenger_in:    { csv: passenger_in,   type: bool, transform: "lower(CAST(value AS VARCHAR)) = 'true'" }
        # taxi_id is vestigial (== vehicle_id for taxis); kept for v0.1 back-compat.
        taxi_id:         { csv: taxi_id,        type: int }
      waypoints:
        unix_time_ms:    { csv: unix_time_ms,   type: bigint }
        lon:             { csv: lon,            type: double }
        lat:             { csv: lat,            type: double }
        link_id:         { csv: link_id,        type: varchar }
        transport_mode:  { csv: transport_mode, type: int }
        purpose:         { csv: purpose,        type: int }
        passenger_in:    { csv: passenger_in,   type: varchar }
        fare_yen:        { csv: fare_yen,       type: double }
        is_night_trip:   { csv: is_night_trip,  type: varchar }
