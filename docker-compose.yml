# docker-compose.yml — one-command Docker deploy for trajectory-viz.
#
# First run (demo map, no host DuckDB required):
#   docker compose up --build
#   → http://localhost:8080
#
# The image bakes demo/demo.duckdb and the React UI. The entrypoint re-seeds
# only if the configured DB path is missing/empty. Set TRAJECTORY_VIZ_SEED_DEMO=0
# to keep an intentionally empty DB (upload-and-go / custom ingest).
#
# Custom DB:
#   TRAJECTORY_VIZ_DB=/data/my.duckdb TRAJECTORY_VIZ_SEED_DEMO=0 \
#     docker compose up --build
#   (place my.duckdb under ./data/)
#
# Default product profile is demo/universal; PFLOW is opt-in (profiles/pflow/).

services:
  trajectory-viz:
    build:
      context: .
      dockerfile: Dockerfile
    image: trajectory-viz:0.2.0a1
    container_name: trajectory-viz
    ports:
      - "8080:8080"
    environment:
      TRAJECTORY_VIZ_DB: /app/demo/demo.duckdb
      PFLOW_VIZ_DB: /app/demo/demo.duckdb
      TRAJECTORY_VIZ_SOURCES: /app/demo/sources.demo.yaml
      PFLOW_VIZ_SOURCES: /app/demo/sources.demo.yaml
      TRAJECTORY_VIZ_OUTPUT_ROOT: /app/demo
      PFLOW_VIZ_OUTPUT_ROOT: /app/demo
      TRAJECTORY_VIZ_PROFILE: demo
      TRAJECTORY_VIZ_SEED_DEMO: "1"
      TRAJECTORY_VIZ_HOST: 0.0.0.0
      TRAJECTORY_VIZ_PORT: 8080
      # Persist drag-and-drop uploads on the host even though the demo DB is baked.
      PFLOW_VIZ_UPLOADS_DIR: /data/uploads
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/api/stats"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
